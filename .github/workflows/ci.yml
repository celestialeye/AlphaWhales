name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Offline quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          config.py roster_store.py data_service.py awfi_service.py main.py
          pair_service.py prefetch.py run.py predictive_sentiment
          investor_screening

      - name: Import application
        run: python -c "import main; print(type(main.app).__name__, len(main.data_service.cache))"

      - name: Check browser JavaScript syntax
        run: node --check static/js/app.js

      - name: Run test suite
        run: python -m pytest -q
